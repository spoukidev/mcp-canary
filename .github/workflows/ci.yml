name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -c "from mcp_canary.server import mcp; print('import ok')"
      - run: python -m mcp_canary.analyze --help || true
      - run: python -m pytest -q
